server {
    listen 80;
    listen 443 ssl;
    server_name localhost h.hony-wen.com h.nyaa.host;
    root /usr/share/nginx/html;

    # Let's Encrypt SAN 证书（h.hony-wen.com + h.nyaa.host），与酒馆共用同一张，
    # 由 macmini 宿主 acme.sh 续期 → acme/reload_certs.py 同步到挂载目录
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    charset utf-8;

    location /files {
        alias /usr/share/nginx/html/files;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /api {
        default_type application/json;
        return 503 '{"success":false,"error":"Upload API is disabled. Set ENABLE_UPLOAD_API=true in file-server/.env to enable."}';
    }

    location /health {
        default_type application/json;
        return 503 '{"status":"upload_api_disabled"}';
    }

    location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|txt|md|config|log|pdf|doc|docx|xls|xlsx|zip|rar)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
