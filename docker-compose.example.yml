services:
  file-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-server
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # 上传 API 端口
    volumes:
      - ./Files:/usr/share/nginx/html/files
      - ./SSL:/etc/nginx/ssl:ro
    environment:
      - PORT=8080
      - UPLOAD_DIR=/usr/share/nginx/html/files
      - FILE_SERVER_BASE_URL=/files
    restart: unless-stopped
    networks:
      - file-server-network

networks:
  file-server-network:
    driver: bridge
