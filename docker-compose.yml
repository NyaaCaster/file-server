services:
  file-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-server
    ports:
      - "5100:5100"
    volumes:
      - ./Files:/usr/share/nginx/html/files
      - ./SSL:/etc/nginx/ssl
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: avg-adventurertavern_app-network
